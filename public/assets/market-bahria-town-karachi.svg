<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9f3ff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
 <linearGradient id="road" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b7c3cb"/><stop offset="1" stop-color="#d5dce0"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".16"/></filter>
</defs>
<rect width="1200" height="720" fill="url(#sky)"/>
<circle cx="1030" cy="105" r="62" fill="#fff1ad"/>
<!-- Bahria Town style boulevard / greenery -->
<path d="M0 490 Q180 445 360 490 T720 485 T1200 475 V720 H0Z" fill="#76ad72"/>
<path d="M0 565 Q220 515 430 560 T850 555 T1200 535 V720 H0Z" fill="#5f9965"/>
<path d="M0 650 H1200 V720 H0Z" fill="url(#road)"/>
<path d="M500 720 L565 570 H635 L700 720Z" fill="#9ca8af"/>
<path d="M585 615 h30" stroke="#f7f3cf" stroke-width="8" stroke-linecap="round"/>
<path d="M570 660 h60" stroke="#f7f3cf" stroke-width="8" stroke-linecap="round"/>
