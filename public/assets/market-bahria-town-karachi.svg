<rect x="410" y="105" width="380" height="58" rx="29" fill="white" opacity=".92"/>
<text x="600" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#276a55">FreshFind • Local Market</text>
</svg>