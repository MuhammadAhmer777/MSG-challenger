 <rect x="190" y="215" width="820" height="86" rx="24" fill="#2e7d62"/>
 <rect x="190" y="275" width="820" height="26" fill="#276a55"/>
 <text x="600" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="white">BAHRIA TOWN KARACHI</text>
 <rect x="245" y="335" width="710" height="150" rx="18" fill="#eef7ef" stroke="#d6e8d8" stroke-width="4"/>
 <!-- produce stalls -->
 <g>
  <rect x="275" y="400" width="170" height="55" rx="12" fill="#d8e8d2"/>
  <circle cx="315" cy="385" r="29" fill="#e64b43"/><circle cx="365" cy="385" r="29" fill="#f5b335"/><circle cx="415" cy="385" r="29" fill="#7ab85a"/>
  <rect x="515" y="400" width="170" height="55" rx="12" fill="#d8e8d2"/>
  <circle cx="555" cy="385" r="29" fill="#f36b3c"/><circle cx="605" cy="385" r="29" fill="#d94f4f"/><circle cx="655" cy="385" r="29" fill="#70a956"/>
  <rect x="755" y="400" width="170" height="55" rx="12" fill="#d8e8d2"/>
  <circle cx="795" cy="385" r="29" fill="#f2c14e"/><circle cx="845" cy="385" r="29" fill="#66a95b"/><circle cx="895" cy="385" r="29" fill="#e85d4a"/>
 </g>
 <rect x="245" y="500" width="710" height="15" rx="7" fill="#c9ddcb"/>
</g>
<!-- distinctive trees -->
<g>
 <rect x="95" y="445" width="18" height="105" rx="8" fill="#795548"/><circle cx="104" cy="420" r="58" fill="#4f8e57"/>
 <rect x="1080" y="440" width="18" height="110" rx="8" fill="#795548"/><circle cx="1089" cy="415" r="60" fill="#4f8e57"/>
</g>
